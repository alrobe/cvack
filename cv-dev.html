<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVack</title>
<link rel="stylesheet" href="./css/styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<header class="top">
 <a class="logo" href="./index.html">CV<b>ack</b></a>
 <div class="top-actions">
  <button class="btn" id="import">Import Json</button>
  <button class="btn" id="export">Export Json</button>
  <button class="btn" id="googleBackup">Back up with Google</button>
  <button class="btn" id="googleRestore">Restore from Google</button>
  <button class="btn blue" id="pdf">Download CV</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
 </div>
</header>

<div class="app">
 <div class="editor-panel">
  <div class="editor-head">Edit CV</div>
  <div class="editor" id="editor"></div>
 </div>
 <div class="preview-panel">
  <div class="preview-head"><strong>Preview</strong><small>Orange Resume · A4</small></div>
  <div class="preview-area" id="preview"></div>
 </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/script.js"></script>
</body>
</html>
